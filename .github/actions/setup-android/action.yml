name: Setup Android
description: JDK / Gradle 설정과 빌드에 필요한 시크릿 파일을 준비한다.

# 어느 잡이든 Gradle을 돌리려면 local.properties 와 keystore, google-services.json 이 있어야 한다.
# 잡마다 같은 스텝을 복붙하면 시크릿이 하나 늘 때 전부 고쳐야 하므로 여기 한 곳에 모은다.
inputs:
  signed-store-password:
    required: true
  signed-key-alias:
    required: true
  signed-key-password:
    required: true
  debug-base-url:
    required: true
  release-base-url:
    required: true
  google-web-client-id:
    required: true
  kakao-native-app-key:
    required: true
  kakao-native-app-key-debug:
    required: true
  mixpanel-token:
    required: true
  keystore-base64:
    required: true
  google-services-json-base64:
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Create local.properties
      shell: bash
      env:
        SIGNED_STORE_PASSWORD: ${{ inputs.signed-store-password }}
        SIGNED_KEY_ALIAS: ${{ inputs.signed-key-alias }}
        SIGNED_KEY_PASSWORD: ${{ inputs.signed-key-password }}
        DEBUG_BASE_URL: ${{ inputs.debug-base-url }}
        RELEASE_BASE_URL: ${{ inputs.release-base-url }}
        GOOGLE_WEB_CLIENT_ID: ${{ inputs.google-web-client-id }}
        KAKAO_NATIVE_APP_KEY: ${{ inputs.kakao-native-app-key }}
        KAKAO_NATIVE_APP_KEY_DEBUG: ${{ inputs.kakao-native-app-key-debug }}
        MIXPANEL_TOKEN: ${{ inputs.mixpanel-token }}
      run: |
        {
          echo "signed.store.file=keystore.jks"
          echo "signed.store.password=$SIGNED_STORE_PASSWORD"
          echo "signed.key.alias=$SIGNED_KEY_ALIAS"
          echo "signed.key.password=$SIGNED_KEY_PASSWORD"
          echo "debug.base.url=$DEBUG_BASE_URL"
          echo "release.base.url=$RELEASE_BASE_URL"
          echo "google.webClientId=$GOOGLE_WEB_CLIENT_ID"
          echo "kakao.nativeAppKey=$KAKAO_NATIVE_APP_KEY"
          echo "kakao.nativeAppKeyDebug=$KAKAO_NATIVE_APP_KEY_DEBUG"
          echo "mixpanel.token=$MIXPANEL_TOKEN"
        } >> local.properties

    - name: Decode Keystore
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
      run: echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

    - name: Decode google-services.json
      shell: bash
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ inputs.google-services-json-base64 }}
      run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

    - name: Configure Gradle
      uses: gradle/actions/setup-gradle@v3
