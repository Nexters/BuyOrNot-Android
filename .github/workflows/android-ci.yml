name: BuyOrNot CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    # 이 잡은 git 쓰기가 필요 없으므로 토큰을 읽기 전용으로 축소한다.
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: unit-test-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # ref를 지정하지 않아 PR에서는 base와 병합된 merge ref를 검증한다.
        # (브랜치 이름으로 체크아웃하면 트리거 커밋이 아닌 최신 tip을 테스트할 수 있다)
        with:
          # Gradle 빌드 스크립트에 토큰이 노출되지 않도록 로컬 git 설정에 남기지 않는다.
          persist-credentials: false

      - uses: ./.github/actions/setup-android
        with:
          signed-store-password: ${{ secrets.SIGNED_STORE_PASSWORD }}
          signed-key-alias: ${{ secrets.SIGNED_KEY_ALIAS }}
          signed-key-password: ${{ secrets.SIGNED_KEY_PASSWORD }}
          debug-base-url: ${{ secrets.DEBUG_BASE_URL }}
          release-base-url: ${{ secrets.RELEASE_BASE_URL }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          kakao-native-app-key: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          kakao-native-app-key-debug: ${{ secrets.KAKAO_NATIVE_APP_KEY_DEBUG }}
          mixpanel-token: ${{ secrets.MIXPANEL_TOKEN }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'
          retention-days: 7

  # PR이 비교 기준으로 삼을 골든을 기록한다 (#153). 아무것도 단정하지 않는다.
  # PR은 screenshot-comparison 워크플로에서 자기 코드를 직접 렌더링하므로, 여기는
  # develop 에 커밋이 쌓일 때만 돌면 된다.
  screenshot-goldens:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # for clone
      actions: write # for upload-artifact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android
        with:
          signed-store-password: ${{ secrets.SIGNED_STORE_PASSWORD }}
          signed-key-alias: ${{ secrets.SIGNED_KEY_ALIAS }}
          signed-key-password: ${{ secrets.SIGNED_KEY_PASSWORD }}
          debug-base-url: ${{ secrets.DEBUG_BASE_URL }}
          release-base-url: ${{ secrets.RELEASE_BASE_URL }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          kakao-native-app-key: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          kakao-native-app-key-debug: ${{ secrets.KAKAO_NATIVE_APP_KEY_DEBUG }}
          mixpanel-token: ${{ secrets.MIXPANEL_TOKEN }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      # --continue 는 한 모듈이 실패해도 나머지 골든을 기록하게 한다.
      - name: Record preview screenshots
        run: ./gradlew recordRoborazziDebug --continue

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-goldens
          path: '**/build/outputs/roborazzi'
          retention-days: 30

  ktlint:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: ktlint-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: ./.github/actions/setup-android
        with:
          signed-store-password: ${{ secrets.SIGNED_STORE_PASSWORD }}
          signed-key-alias: ${{ secrets.SIGNED_KEY_ALIAS }}
          signed-key-password: ${{ secrets.SIGNED_KEY_PASSWORD }}
          debug-base-url: ${{ secrets.DEBUG_BASE_URL }}
          release-base-url: ${{ secrets.RELEASE_BASE_URL }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          kakao-native-app-key: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          kakao-native-app-key-debug: ${{ secrets.KAKAO_NATIVE_APP_KEY_DEBUG }}
          mixpanel-token: ${{ secrets.MIXPANEL_TOKEN }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Run ktlint check
        id: ktlint
        run: ./gradlew ktlintCheck
        continue-on-error: true

      - name: Fail with guide message (fork PR)
        if: steps.ktlint.outcome == 'failure' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::ktlint 검사에 실패했습니다. Fork PR은 자동 포맷팅이 지원되지 않습니다."
          echo "::error::로컬에서 ./gradlew ktlintFormat 실행 후 다시 push 해주세요."
          exit 1

      - name: Auto-fix with ktlintFormat (internal branch only)
        if: steps.ktlint.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        run: ./gradlew ktlintFormat

      - name: Commit and push ktlint fixes (internal branch only)
        if: steps.ktlint.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          ISSUE=$(echo "$BRANCH" | grep -oP '#\d+' | head -1)
          if [ -n "$ISSUE" ]; then
            MSG="chore/${ISSUE}: ktlint 포맷팅"
          else
            MSG="chore: ktlint 포맷팅"
          fi
          git diff --quiet || (git add -A && git commit -m "$MSG")
          git push origin HEAD:${GITHUB_HEAD_REF}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 프리뷰가 외부 URL을 때리면 렌더 결과가 네트워크 상태에 좌우되어, UI를 건드리지 않은
  # PR에서도 스크린샷 diff가 뜬다 (#153). 시크릿도 Gradle도 필요 없어 별도 잡으로 둔다.
  preview-network-urls:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
    concurrency:
      group: preview-network-urls-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check-preview-network-urls.py
